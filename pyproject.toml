[tool.ruff]
line-length = 120
lint.select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]
# ignore = [
#     "",  # line-too-long
#     "",
#     "",
#]

lint.ignore=["E501", "F821", "E402"]


[tool.ruff.format]
indent-style = "space"
